<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=1" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
<link rel="shortcut icon" href="/favicon.ico?v=1" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
<meta name="apple-mobile-web-app-title" content="SoshiPhotography" />
<link rel="manifest" href="/site.webmanifest?v=1" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Soshi Photography</title>
<meta name="description" content="Outdoor photography portfolio by Soshi Photography.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #3f4146;
    --muted: #8a8f98;
    --line: #e8ebef;
    --accent: #6d86a6;
    --peach: #e7b98f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }

  /* Navigation (dark text on white for this page) */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 5vw; border-bottom: 1px solid var(--line);
  }
  .logo img { height: 78px; width: auto; display: block; }
  nav { display: flex; gap: 28px; flex-wrap: wrap; }
  nav a {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
    padding-bottom: 3px; border-bottom: 1px solid transparent; color: var(--muted);
  }
  nav a:hover { color: var(--ink); border-bottom-color: var(--peach); }
  nav a.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* Title */
  .page-title { text-align: center; padding: 70px 5vw 40px; }
  .eyebrow {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
    color: var(--accent); display: block; margin-bottom: 12px;
  }
  h1 { font-weight: 400; font-size: clamp(2rem, 4.5vw, 3rem); }

  /* Photo grid: filled from data/portfolio.json */
  .grid { columns: 3; column-gap: 14px; padding: 20px 3vw 90px; max-width: 1500px; margin: 0 auto; }
  figure.item {
    break-inside: avoid; margin-bottom: 14px; position: relative; overflow: hidden;
    cursor: zoom-in; background: var(--g, #dbe8ee); min-height: 120px;
  }
  figure.item img {
    display: block; width: 100%; height: auto;
    color: transparent; transition: transform .5s ease, opacity .3s;
  }
  .empty { text-align: center; color: var(--muted); column-span: all; padding: 40px 0; }
  figure.item:hover img { transform: scale(1.03); }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.97);
    display: none; align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb .stage { max-width: 90vw; max-height: 86vh; display: flex; }
  .lb .stage img { max-width: 90vw; max-height: 86vh; object-fit: contain; display: block; }
  .lb button {
    position: absolute; background: none; border: 0; cursor: pointer;
    color: var(--ink); font-size: 2.2rem; line-height: 1; padding: 18px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 200;
    opacity: .6; transition: opacity .2s;
  }
  .lb button:hover { opacity: 1; }
  .lb .close { top: 8px; right: 14px; }
  .lb .prev { left: 10px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 10px; top: 50%; transform: translateY(-50%); }

  .contact-line {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 14px;
  }
  .contact-line a { border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: color .2s, border-color .2s; }
  .contact-line a:hover { color: var(--ink); border-color: var(--peach); }

  footer {
    border-top: 1px solid var(--line); text-align: center; padding: 36px 5vw;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted);
  }

  @media (max-width: 900px) { .grid { columns: 2; } }
  @media (max-width: 600px) {
    .grid { columns: 1; }
    header { flex-direction: column; gap: 6px; padding-bottom: 14px; }
    .logo img { height: 64px; }
    nav { gap: 18px; justify-content: center; }
  }
</style>

<style>
  /* Keep the logo and menu fixed at the top while scrolling */
  html { scroll-padding-top: 110px; }
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: #ffffff;
  }

  /* Smaller menu on phones so it doesn't take over the screen */
  @media (max-width: 760px) {
    html { scroll-padding-top: 120px; }
    header { flex-direction: column; gap: 4px; padding: 6px 5vw 8px; }
    .logo img { height: 46px; }
    nav { gap: 6px 16px; justify-content: center; }
    nav a { font-size: .66rem; letter-spacing: .12em; }
  }
</style>  
</head>
<body>

<header>
  <a class="logo" href="/"><img src="/images/logo.png" alt="Soshi Photography"></a>
  <nav>
    <a href="/">Home</a>
    <a class="active" href="/portfolio">Portfolio</a>
    <a href="/pricing">Pricing</a>
    <a href="/galleries">Client Galleries</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>

<div class="page-title">
  <h1>Gallery</h1>
</div>

<main class="grid" id="grid"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo">&#8249;</button>
  <div class="stage" id="stage"></div>
  <button class="next" aria-label="Next photo">&#8250;</button>
</div>

<footer>
  <p class="contact-line">
    <a href="mailto:info@soshiphotography.com">info@soshiphotography.com</a>
    <a href="tel:+972553399483">055-339-9483</a>
    <span>Jerusalem</span>
  </p>
  <p>&copy; <span id="yr"></span> Soshi Photography</p>
</footer>

<script>
document.getElementById("yr").textContent = new Date().getFullYear();

// Photos are listed in data/portfolio.json (edit them from the admin page).
(function () {
  const grid = document.getElementById("grid");
  const lb = document.getElementById("lb");
  const stage = document.getElementById("stage");
  const colors = ["#cfe4ee", "#d6ead7", "#e3eef3", "#dcebd3", "#d3e3ec", "#e6efdc"];
  let photos = [], current = 0;

  function show(i) {
    current = (i + photos.length) % photos.length;
    stage.innerHTML = "";
    const big = document.createElement("img");
    big.src = photos[current].image; big.alt = photos[current].alt || "";
    stage.appendChild(big);
  }
  function open(i) { show(i); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
  function close() { lb.classList.remove("open"); document.body.style.overflow = ""; }

  lb.querySelector(".close").addEventListener("click", close);
  lb.querySelector(".prev").addEventListener("click", () => show(current - 1));
  lb.querySelector(".next").addEventListener("click", () => show(current + 1));
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });

  fetch("/data/portfolio.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(list => {
      photos = (Array.isArray(list) ? list : []).filter(x => x && x.image);
      if (!photos.length) {
        const m = document.createElement("p");
        m.className = "empty";
        m.textContent = "New photos coming soon.";
        grid.appendChild(m);
        return;
      }
      photos.forEach((ph, i) => {
        const f = document.createElement("figure");
        f.className = "item";
        f.style.setProperty("--g", colors[i % colors.length]);
        const img = document.createElement("img");
        img.src = ph.image; img.alt = ph.alt || "Photo by Soshi Photography"; img.loading = "lazy";
        f.appendChild(img);
        f.addEventListener("click", () => open(i));
        grid.appendChild(f);
      });
    });
})();
</script>
</body>
</html>
